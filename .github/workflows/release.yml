name: Release

# Triggered by pushing a `v*` tag. Verifies the tag matches package.json, runs
# the full gate, then publishes. Previously releases were tagged by hand with no
# automation, which is how v2.9.3 ended up tagged on GitHub but 404 on npm.
on:
  push:
    tags:
      - "v*"

permissions:
  # Create the GitHub release for the tag.
  contents: write
  # Let npm publish --provenance get a signed GitHub identity token, so the
  # package shows it was built by this workflow from this repo.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # A tag that disagrees with package.json is how you publish a version
      # nobody can install, or leave a tag pointing at unreleased code.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Check the version is not already published
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@flarelog/sdk@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG_VERSION is already on npm. Bump the version or unpublish first."
            exit 1
          fi

      # Without this, a missing token only shows up as ENEEDAUTH at the very
      # end, after the full test suite.
      - name: Check the npm token is set
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is missing. Add an npm automation token under Settings > Environments > npm > Environment secrets."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
