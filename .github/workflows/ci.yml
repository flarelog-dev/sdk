name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
      - name: Run smoke testing
        run: npm run test:smoke

  contract-tests:
    name: Contract tests (real framework packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The TanStack Start, Hono, Next and Express suites mock these packages
      # with hand-rolled stubs. Without this job, a real package dropping an
      # API leaves 200+ unit tests green while production breaks — which is how
      # a broken build reaches a publish.
      #
      # --save-dev rather than --no-save: with --no-save, npm reconciles the
      # tree against package.json and prunes these straight back out, so they
      # never actually land. This job's checkout is throwaway, so recording
      # them as devDeps here is harmless — it is not committed.
      #
      # --legacy-peer-deps because these are optional peers that disagree with
      # the repo's React 18. --ignore-scripts because next's SWC postinstall is
      # a large native download the contract test does not need (it only
      # imports the package entry).
      - name: Install real framework packages
        run: npm install --save-dev --legacy-peer-deps --ignore-scripts @tanstack/react-start@latest hono@latest express@latest next@latest

      # The contract tests skip when a package is absent, so a silently-failed
      # install would turn this whole job into a green no-op. Assert every
      # package actually resolves before trusting the result.
      - name: Verify framework packages resolve
        run: |
          node --input-type=module -e "
          const pkgs = ['@tanstack/react-start', 'hono', 'express', 'next'];
          const missing = [];
          for (const p of pkgs) {
            try {
              await import(p);
              console.log('resolved:', p);
            } catch (e) {
              missing.push(p);
              console.error('NOT RESOLVABLE:', p, e.code || e.message);
            }
          }
          if (missing.length) {
            console.error('Missing framework packages:', missing.join(', '));
            process.exit(1);
          }
          "

      - name: Run contract tests
        run: npm run test:contract

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify exports
        run: |
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)
          test -f dist/frameworks/react.js || (echo "Missing react export" && exit 1)
          test -f dist/frameworks/express.js || (echo "Missing express export" && exit 1)
          test -f dist/frameworks/hono.js || (echo "Missing hono export" && exit 1)
          test -f dist/frameworks/next.js || (echo "Missing next export" && exit 1)
          test -f dist/frameworks/cf-workers.js || (echo "Missing cf-workers export" && exit 1)
          test -f dist/frameworks/tanstack-start.js || (echo "Missing tanstack-start export" && exit 1)
          echo "All exports verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
